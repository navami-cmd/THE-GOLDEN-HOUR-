<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c6e3a"/><stop offset=".3" stop-color="#e9d6a4"/><stop offset=".5" stop-color="#fffaf0"/><stop offset=".7" stop-color="#d2b273"/><stop offset="1" stop-color="#8c6e3a"/></linearGradient>
  <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3dc"/><stop offset=".6" stop-color="#d7bb7e"/><stop offset="1" stop-color="#a5844a"/></linearGradient>
  <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c8a763" stop-opacity="0"/><stop offset=".5" stop-color="#f6ecd0"/><stop offset="1" stop-color="#c8a763" stop-opacity="0"/></linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7bb7e" stop-opacity=".5"/><stop offset="1" stop-color="#d7bb7e" stop-opacity="0"/></linearGradient>
  <clipPath id="up"><rect x="0" y="0" width="240" height="84"/></clipPath>
  <clipPath id="dn"><rect x="0" y="87" width="240" height="53"/></clipPath>
