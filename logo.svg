</g>
<rect x="12" y="84.2" width="216" height="1.6" fill="url(#h)"/>
<!-- soft reflection below the horizon -->
<g clip-path="url(#dn)" fill="none" stroke="url(#r)">
  <circle cx="120" cy="87" r="30" fill="url(#r)" stroke="none"/>
  <circle cx="120" cy="87" r="42" stroke-width="1.3"/>
