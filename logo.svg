<!-- rising sun made of record grooves -->
<g clip-path="url(#up)" fill="none" stroke="url(#g)">
  <circle cx="120" cy="85" r="78" stroke-width="1" opacity=".3"/>
  <circle cx="120" cy="85" r="66" stroke-width="1.1" opacity=".45"/>
  <circle cx="120" cy="85" r="54" stroke-width="1.3" opacity=".65"/>
  <circle cx="120" cy="85" r="42" stroke-width="1.5" opacity=".9"/>
