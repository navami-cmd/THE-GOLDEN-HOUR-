<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#65533a"/><stop offset=".3" stop-color="#c5aa79"/><stop offset=".5" stop-color="#f6f1ea"/><stop offset=".7" stop-color="#ac8c58"/><stop offset="1" stop-color="#65533a"/></linearGradient>
