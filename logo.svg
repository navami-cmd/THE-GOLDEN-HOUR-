  <linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d8152" stop-opacity="0"/><stop offset=".5" stop-color="#e6dfd3"/><stop offset="1" stop-color="#9d8152" stop-opacity="0"/></linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b19360" stop-opacity=".5"/><stop offset="1" stop-color="#b19360" stop-opacity="0"/></linearGradient>
