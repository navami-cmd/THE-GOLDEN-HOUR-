<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour – every film has its light</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="galaxy" aria-hidden="true"></canvas>
<div class="vignette"></div><div class="grain"></div>
<div class="glow" id="glow"></div>
<div class="progress" id="progress"></div>

<!-- INTRO -->
<div class="intro" id="intro">
  <div class="door l"></div><div class="door r"></div>
  <div class="stage">
    <div class="turntable">
      <div class="record"><span class="spindle"></span></div>
      <div class="sheen"></div>
      <svg class="arm" viewBox="0 0 300 300" aria-hidden="true">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0bd"/><stop offset=".5" stop-color="#c98f2a"/><stop offset="1" stop-color="#ffe49a"/></linearGradient></defs>
        <path d="M262 40L120 196" stroke="url(#ag)" stroke-width="8" stroke-linecap="round" fill="none"/>
        <rect x="92" y="184" width="34" height="18" rx="3" fill="#15100a" stroke="#d9a63a" stroke-width="2" transform="rotate(48 109 193)"/>
        <circle cx="262" cy="40" r="20" fill="url(#ag)"/><circle cx="262" cy="40" r="7" fill="#15100a"/>
      </svg>
    </div>
    <div class="brand">
      <div class="logowrap"><i class="ripple"></i><i class="ripple r2"></i><img class="bigclock" src="logo.svg" alt="" onerror="this.remove()"></div>
      <h1 class="gold-text">GOLDEN HOUR</h1>
      <p class="tag">every film has its light</p>
    </div>
  </div>
  <div class="cine top"></div><div class="cine bottom"></div>
  <div class="reelbar"><i></i></div>
  <small class="skip">tap anywhere to skip</small>
</div>

<header class="nav" id="nav">
  <a class="logo" href="#"><img src="logo.svg" alt="" onerror="this.remove()"><span class="gold-text">GOLDEN HOUR</span></a>
  <input id="search" type="search" placeholder="Search any movie   ( / )" aria-label="Search movies">
  <button id="surprise" class="primary">Surprise me</button>
  <button id="vaultBtn">My vault <b id="vaultCount">0</b></button>
</header>

<section class="hero" id="hero"></section>

<main class="browse">
  <div id="rails"></div>
  <section class="panel">
    <div class="phead"><h2 class="gold-text">How are you feeling tonight?</h2><button id="quizBtn" class="primary">Find my film in 3 questions</button></div>
    <div id="moods" class="chips moods"></div>
    <div class="filters">
      <label>Time machine
        <select id="era"></select></label>
      <label>Time you have
        <select id="runtime">
          <option value="">Any length</option>
          <option value="lte100">Under 100 min</option>
          <option value="lte130">Under 2h 10m</option>
          <option value="gte150">Epic, 2h 30m+</option>
        </select></label>
      <label>Language
        <select id="lang">
          <option value="">Any language</option><option value="ta">Tamil</option><option value="hi">Hindi</option>
          <option value="te">Telugu</option><option value="ml">Malayalam</option><option value="kn">Kannada</option>
          <option value="en">English</option><option value="ko">Korean</option><option value="ja">Japanese</option>
          <option value="fr">French</option><option value="es">Spanish</option>
        </select></label>
      <label>Minimum rating: <b id="minrv">Any</b>
        <input type="range" id="minr" min="0" max="9" step="1" value="0"></label>
      <label>Sort by
        <select id="sort">
          <option value="popularity.desc">Most popular</option>
          <option value="vote_average.desc">Top rated</option>
          <option value="primary_release_date.desc">Newest</option>
          <option value="revenue.desc">Biggest box office</option>
        </select></label>
    </div>
  </section>

  <div id="genres" class="chips"></div>
  <div class="bar"><h2 id="heading" class="gold-text">Popular right now</h2><small id="count"></small></div>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel">Loading more films…</div>
</main>

<aside class="vault" id="vault" aria-label="My vault"></aside>
<div class="roulette" id="roulette"></div>
<div class="roulette" id="quiz"></div>
<button id="toTop" aria-label="Back to top">↑</button>
<dialog id="modal"></dialog>
<div id="toast" role="status"></div>

<script src="galaxy.js"></script>
<script src="intro.js"></script>
<script src="script.js"></script>
</body>
</html>
