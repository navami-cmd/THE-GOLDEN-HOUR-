<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golden Hour – every film has its light</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="galaxy" aria-hidden="true"></canvas>
<div class="ambient" id="ambient"></div><div class="vignette"></div><div class="grain"></div>
<div class="glow" id="glow"></div>
<div class="progress" id="progress"></div>

<!-- INTRO: gold record on a black marble deck, then the title card -->
<div class="intro" id="intro">
  <div class="door t"></div><div class="door b"></div>
  <div class="seam"></div>
  <div class="stage">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="deck">
      <div class="plinth">
        <div class="platter"></div>
        <div class="record"><span class="label"></span></div>
        <div class="sheen"></div>
        <svg class="arm" viewBox="0 0 300 300" aria-hidden="true">
          <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ecd0"/><stop offset=".5" stop-color="#b99a5c"/><stop offset="1" stop-color="#eadbb0"/></linearGradient></defs>
          <path d="M262 40L120 196" stroke="url(#ag)" stroke-width="8" stroke-linecap="round" fill="none"/>
          <rect x="92" y="184" width="34" height="18" rx="3" fill="#15120c" stroke="#cdb078" stroke-width="2" transform="rotate(48 109 193)"/>
          <circle cx="262" cy="40" r="22" fill="#0d0c0a" stroke="url(#ag)" stroke-width="3"/><circle cx="262" cy="40" r="8" fill="url(#ag)"/>
        </svg>
      </div>
    </div>
    <div class="brand">
      <img class="bigclock" src="logo.svg" alt="">
      <div class="titlewrap"><h1 class="gold-text" data-t="GOLDEN HOUR">GOLDEN HOUR</h1><i class="glint g1"></i><i class="glint g2"></i><i class="glint g3"></i></div>
      <p class="tag">every film has its light</p>
    </div>
    <span class="tc" id="tc">00:00:00:00</span><span class="pct" id="pct">0%</span>
  </div>
  <div class="reelbar"><i></i></div>
  <small class="skip">click anywhere to skip</small>
</div>

<header class="nav" id="nav">
  <a class="logo" href="#"><img src="logo.svg" alt=""><span class="gold-text">GOLDEN HOUR</span></a>
  <input id="search" type="search" placeholder="Search any movie   ( / )" aria-label="Search movies">
  <button id="surprise" class="primary">Surprise me</button>
  <button id="vaultBtn">My vault <b id="vaultCount">0</b></button>
</header>

<section class="hero themed" id="hero"></section>

<main class="browse">
  <div id="rails"></div>

  <details class="panel" open>
    <summary><span class="gold-text">Find your film</span><small>filters</small></summary>
    <div class="pbody">
      <div class="prow"><h3 class="ph" style="margin:0">How are you feeling tonight?</h3><button id="quizBtn" class="primary">3-question quiz</button></div>
      <div id="moods" class="chips moods"></div>

      <h3 class="ph">Genres <span id="gmode" class="seg"></span></h3>
      <div id="genres" class="chips"></div>

      <h3 class="ph">Time machine</h3>
      <div id="eras" class="chips"></div>

      <div class="filters">
        <label>From year <select id="yf"></select></label>
        <label>To year <select id="yt"></select></label>
        <label>Length
          <select id="runtime">
            <option value="">Any length</option><option value="lte90">Under 90 min</option><option value="lte120">Under 2 hours</option>
            <option value="gte120">Over 2 hours</option><option value="gte150">Epic, 2h 30m+</option>
          </select></label>
        <label>Language
          <select id="lang">
            <option value="">Any language</option><option value="ta">Tamil</option><option value="hi">Hindi</option>
            <option value="te">Telugu</option><option value="ml">Malayalam</option><option value="kn">Kannada</option>
            <option value="bn">Bengali</option><option value="mr">Marathi</option><option value="en">English</option>
            <option value="ko">Korean</option><option value="ja">Japanese</option><option value="zh">Chinese</option>
            <option value="fr">French</option><option value="es">Spanish</option><option value="de">German</option>
            <option value="it">Italian</option><option value="th">Thai</option><option value="tr">Turkish</option>
          </select></label>
        <label>Minimum rating: <b id="minrv">Any</b>
          <input type="range" id="minr" min="0" max="9" step="0.5" value="0"></label>
        <label>Sort by
          <select id="sort">
            <option value="popularity.desc">Most popular</option><option value="vote_average.desc">Top rated</option>
            <option value="vote_count.desc">Most voted</option><option value="primary_release_date.desc">Newest first</option>
            <option value="primary_release_date.asc">Oldest first</option><option value="revenue.desc">Biggest box office</option>
            <option value="original_title.asc">Title A to Z</option>
          </select></label>
        <label class="chk"><input type="checkbox" id="obscure"> Include obscure films</label>
      </div>

      <div id="active" class="active"></div>
    </div>
  </details>

  <div class="bar"><h2 id="heading" class="gold-text">Popular right now</h2><small id="count"></small></div>
  <div id="grid" class="grid"></div>
  <div id="sentinel" class="sentinel">Loading more films…</div>
</main>

<aside class="vault" id="vault" aria-label="My vault"></aside>
<div class="roulette" id="roulette"></div>
<div class="roulette" id="quiz"></div>
<button id="toTop" aria-label="Back to top">↑</button>
<dialog id="modal" class="themed"></dialog>
<div id="toast" role="status"></div>

<script src="galaxy.js"></script>
<script src="intro.js"></script>
<script src="script.js"></script>
</body>
</html>
